<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">MINBAK TI — Homepage redesign preview</title>
<desc id="desc">Source-aligned visual preview of the redesigned MINBAK TI public homepage, featuring a Denty-inspired light cyan palette and an interactive branching Talent Network concept. It is an illustration derived from the source design, not a browser screenshot.</desc>
<defs>
  <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7FAFB"/><stop offset="1" stop-color="#EAF3F6"/></linearGradient>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E6F7FA"/><stop offset=".55" stop-color="#DDF3F7"/><stop offset="1" stop-color="#F4FAFB"/></linearGradient>
  <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset=".55" stop-color="#C5ECF3"/><stop offset="1" stop-color="#8BC9DA"/></linearGradient>
  <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#091721"/><stop offset="1" stop-color="#214D62"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7ABACB"/><stop offset="1" stop-color="#3D6C97"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#9BE2F3" stop-opacity=".85"/><stop offset="1" stop-color="#9BE2F3" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#9ABBC5" stroke-opacity=".12" stroke-width="1"/></pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="13" stdDeviation="18" flood-color="#244C5D" flood-opacity=".12"/></filter>
  <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="22"/></filter>
  <style>
    .sans{font-family:Manrope,Arial,sans-serif}.mono{font-family:'DM Mono',Consolas,monospace}
    .nav{font:600 13px Manrope,Arial,sans-serif;fill:#607985}.muted{fill:#718893}.ink{fill:#091721}
    .branch{fill:none;stroke:url(#line);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:6 9;opacity:.82;animation:flow 8s linear infinite}
    .branch:nth-of-type(2n){animation-duration:11s;animation-direction:reverse}
    .node{fill:#fff;stroke:#5FA2BE;stroke-width:3;filter:url(#shadow)}
    .node-core{fill:url(#core);stroke:#4F91A7;stroke-width:2.5;filter:url(#shadow)}
    .pulse{fill:none;stroke:#8BCFDF;stroke-width:1.5;opacity:.7;transform-box:fill-box;transform-origin:center;animation:pulse 3.6s ease-in-out infinite}
    .label{font:700 10px 'DM Mono',Consolas,monospace;fill:#547A8A;letter-spacing:1px}
    .pill{font:700 10px Manrope,Arial,sans-serif;fill:#406B7E}
    @keyframes flow{to{stroke-dashoffset:-120}}
    @keyframes pulse{0%,100%{transform:scale(.84);opacity:.32}50%{transform:scale(1.22);opacity:.82}}
    @media(prefers-reduced-motion:reduce){.branch,.pulse{animation:none!important}}
  </style>
</defs>
<rect width="1600" height="1000" fill="url(#page)"/>
<rect width="1600" height="1000" fill="url(#grid)" opacity=".5"/>
