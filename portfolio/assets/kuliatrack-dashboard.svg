<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">KuliaTrack academic dashboard preview</title>
<desc id="desc">A Neo-Brutalist academic productivity dashboard with navigation, task metrics, urgent assignments, courses, and upcoming agenda. Illustrative sample data.</desc>
<defs>
  <pattern id="paperGrid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1c1b1b" stroke-opacity=".055" stroke-width="1"/></pattern>
  <filter id="hardShadow" x="-20%" y="-20%" width="150%" height="150%"><feOffset dx="4" dy="4"/><feComponentTransfer><feFuncA type="linear" slope=".9"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .sans{font-family:Inter,Arial,sans-serif}.display{font-family:'Arial',sans-serif;font-weight:800}.mono{font-family:'Courier New',monospace}
    .ink{fill:#1c1b1b}.muted{fill:#625d59}.small{font-size:12px}.tiny{font-size:10px}.label{font-family:'Courier New',monospace;font-size:10px;font-weight:700;letter-spacing:1px}
  </style>
</defs>
