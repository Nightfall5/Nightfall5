<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Neo-Brutalist student login interface preview</title><desc id="desc">A graph-paper login interface with high-contrast form panel, NIM or email input, password field, and validation feedback.</desc>
<defs><pattern id="pbpgrid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#161a18" stroke-opacity=".09"/></pattern><filter id="hard"><feOffset dx="8" dy="8"/><feGaussianBlur stdDeviation="0"/><feComponentTransfer><feFuncA type="linear" slope=".8"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1600" height="1000" fill="#fbf8ef"/><rect width="1600" height="1000" fill="url(#pbpgrid)"/>
<rect x="74" y="63" width="1452" height="82" fill="#fff" stroke="#171b19" stroke-width="3"/><rect x="100" y="82" width="43" height="43" fill="#f2ef24" stroke="#171b19" stroke-width="3"/><text x="121" y="111" text-anchor="middle" fill="#171b19" font-family="Arial" font-size="20" font-weight="900">P</text><text x="162" y="111" fill="#171b19" font-family="Arial" font-size="23" font-weight="900">STUDENT PORTAL</text><text x="1230" y="110" fill="#5b625c" font-family="Courier New" font-size="12">ACADEMIC ACCESS</text>
<text x="190" y="290" fill="#171b19" font-family="Arial" font-size="64" font-weight="900">Your next step</text><text x="190" y="362" fill="#171b19" font-family="Arial" font-size="64" font-weight="900">starts here<span fill="#c52d25">.</span></text><rect x="195" y="400" width="285" height="42" fill="#a3e635" stroke="#171b19" stroke-width="3"/><text x="337" y="427" text-anchor="middle" fill="#171b19" font-family="Courier New" font-size="13" font-weight="700">RESPONSIVE LOGIN UI</text>
<text x="194" y="495" fill="#5e625c" font-family="Arial" font-size="17">A focused interface for clear and</text><text x="194" y="523" fill="#5e625c" font-family="Arial" font-size="17">accessible student authentication.</text>
<rect x="190" y="588" width="300" height="3" fill="#171b19"/><text x="190" y="630" fill="#5e625c" font-family="Courier New" font-size="12">DESIGN SYSTEM / NEO-BRUTALISM</text>
<rect x="850" y="196" width="510" height="630" fill="#fff" stroke="#171b19" stroke-width="4" filter="url(#hard)"/>
<rect x="886" y="224" width="128" height="28" fill="#f2ef24" stroke="#171b19" stroke-width="2"/><text x="950" y="243" text-anchor="middle" fill="#171b19" font-family="Courier New" font-size="10" font-weight="700">SIGN IN / 01</text>
<text x="886" y="323" fill="#171b19" font-family="Arial" font-size="49" font-weight="900">Welcome back.</text><text x="890" y="358" fill="#5b625c" font-family="Arial" font-size="14">Enter your student account details to continue.</text>
<text x="890" y="420" fill="#171b19" font-family="Courier New" font-size="13" font-weight="700">NIM / EMAIL</text><rect x="886" y="439" width="438" height="58" fill="#fbf8ef" stroke="#171b19" stroke-width="3"/><text x="910" y="475" fill="#7b817b" font-family="Arial" font-size="15">Enter your NIM or email</text>
<text x="890" y="553" fill="#171b19" font-family="Courier New" font-size="13" font-weight="700">PASSWORD</text><rect x="886" y="572" width="438" height="58" fill="#fbf8ef" stroke="#171b19" stroke-width="3"/><text x="910" y="608" fill="#171b19" font-family="Arial" font-size="17">••••••••••</text><text x="1288" y="608" fill="#5b625c" font-family="Arial" font-size="13">SHOW</text>
<rect x="886" y="663" width="438" height="68" fill="#f2ef24" stroke="#171b19" stroke-width="3" filter="url(#hard)"/><text x="1105" y="705" text-anchor="middle" fill="#171b19" font-family="Courier New" font-size="15" font-weight="700">SIGN IN  →</text>
<text x="890" y="775" fill="#7b817b" font-family="Courier New" font-size="10">CLIENT-SIDE VALIDATION · RESPONSIVE LAYOUT</text>
<rect x="1250" y="858" width="275" height="54" fill="#c52d25" stroke="#171b19" stroke-width="3"/><text x="1387" y="892" text-anchor="middle" fill="#fff" font-family="Courier New" font-size="12" font-weight="700">DESKTOP + MOBILE</text>
</svg>