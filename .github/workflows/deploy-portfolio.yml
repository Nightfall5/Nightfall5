name: Deploy interactive portfolio to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "portfolio/**"
      - ".github/workflows/deploy-portfolio.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install Chromium for portfolio screenshot capture
        run: npx --yes playwright@1.57.0 install --with-deps chromium

      - name: Capture LUXU at native 1920x913 resolution
        run: |
          npx --yes playwright@1.57.0 screenshot \
            --browser chromium \
            --viewport-size "1920,913" \
            --wait-for-timeout 2500 \
            https://nightfall5.github.io/Landing-Page-Parfume/ \
            portfolio/assets/luxu-landing.png
          file portfolio/assets/luxu-landing.png

      - name: Upload portfolio site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./portfolio

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
